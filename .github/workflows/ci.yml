name: ci

# Two jobs, one rule each:
#
#   check    — a pull request must not merge with a red build. It runs exactly
#              what `pnpm run check` runs locally, so "green here" and "green on
#              my machine" are the same claim.
#   release  — a pushed `v*` tag publishes to npm. Tagging is the deliberate act
#              that ships; merging is not.
#
# The split matters: this package is installed by users, so an accidental merge
# must not reach the registry. A tag is a decision someone made on purpose.

on:
  pull_request:
  push:
    branches: [main]
    tags:
      # A release tag is `v1.0.0`, `v0.2.0-rc.1`, and nothing else. Anchoring it
      # means a stray `v-next` or `version-2` tag does not publish.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# Cancel a superseded PR check. Never cancel a release: the window between
# `npm publish` and the artifact upload is not a window to interrupt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The suite is seconds today; the budget exists so a hung `pnpm install`
    # cannot hold a runner for the default six hours.
    timeout-minutes: 20
    strategy:
      # Never mask a failure on one Node version with a pass on the other: this
      # package spawns child processes and reads `import.meta.url`, both of which
      # have moved between LTS lines.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No `version:` here: package.json's `packageManager` names
      # pnpm 11.22.0 exactly, and the action refuses to start when both are
      # given ("Multiple versions of pnpm specified"). Reading the exact pin is
      # also stricter than the `version: 11` major range it replaces.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # `--frozen-lockfile` is the point: a lockfile that disagrees with the
      # manifest must fail here, not resolve something different on a runner
      # and publish it.
      - run: pnpm install --frozen-lockfile

      # One command, and it is the same one a contributor runs. It covers
      # typecheck (all three tsconfig projects), the unit suite, the builds, and
      # the two artifact guards (`check-client-banner`, `check-theme-tokens`).
      - name: Typecheck, test, build
        run: pnpm run check

      # A failure here is usually a broken lockfile rather than a broken build,
      # so it is named separately. `pnpm run check` already builds; this proves
      # the tarball a user would get actually contains the entry points.
      - name: The published tarball contains its entry points
        run: |
          pnpm pack --pack-destination /tmp
          tarball=$(ls /tmp/dsh-suite-store-*.tgz)
          tar -tzf "$tarball" | grep -qx 'package/lib/index.js'         || { echo "::error::tarball is missing lib/index.js"; exit 1; }
          tar -tzf "$tarball" | grep -qx 'package/lib/types/index.d.ts' || { echo "::error::tarball is missing lib/types/index.d.ts"; exit 1; }
          tar -tzf "$tarball" | grep -qx 'package/client/client.js'     || { echo "::error::tarball is missing client/client.js"; exit 1; }
          tar -tzf "$tarball" | grep -qx 'package/cordis.patch.yml'     || { echo "::error::tarball is missing cordis.patch.yml"; exit 1; }
          echo "tarball ok: $(basename "$tarball")"

  # The repository's own checks passed; this job asserts the SUBMITTED catalog
  # is still readable by the parser that ships in this tarball. A schema change
  # that only breaks at install time is the one failure a user would meet first.
  catalog-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No `version:` here: package.json's `packageManager` names
      # pnpm 11.22.0 exactly, and the action refuses to start when both are
      # given ("Multiple versions of pnpm specified"). Reading the exact pin is
      # also stricter than the `version: 11` major range it replaces.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # The fixture is one real generation of the catalog repository's output.
      # It carries a single card, so it proves the SHAPE parses; the richer
      # check is the live catalog below, which is what users actually receive.
      - name: The catalog fixture parses
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { parseCatalogIndex } from './lib/catalog/types.js'
            const index = JSON.parse(readFileSync('tests/fixtures/catalog-index.json', 'utf8'))
            const parsed = parseCatalogIndex(index)
            if (parsed.bundles.length === 0) throw new Error('fixture parsed to zero cards')
            console.log('parsed', parsed.bundles.length, 'card(s) from the fixture')
          "

      # The published catalog is the document every user downloads. A parser
      # change that rejects it breaks every install while every unit test stays
      # green, because the fixtures are ours and the catalog is not. A fetch
      # failure is a WARNING (the network is not this PR's fault); a parse
      # failure is an ERROR, because that is the defect this job exists for.
      - name: The published catalog parses
        run: |
          node --input-type=module -e "
            import { parseCatalogIndex } from './lib/catalog/types.js'
            const url = 'https://cdn.jsdelivr.net/npm/dsh-suite-store-catalog@latest/index.json'
            let document
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(20_000) })
              if (!response.ok) throw new Error('HTTP ' + response.status)
              document = await response.json()
            } catch (error) {
              console.log('::warning::could not fetch the published catalog (' + error.message + '); live check skipped')
              process.exit(0)
            }
            const parsed = parseCatalogIndex(document)
            if (parsed.bundles.length === 0) throw new Error('the published catalog parsed to zero cards')
            console.log('parsed', parsed.bundles.length, 'cards from the published catalog')
          "

      # The tarball is what a user installs, so the assertion that matters is
      # that the data documents did NOT ride along: they are unused at runtime
      # and adding ~80 kB to every download for nothing.
      - name: The tarball carries no preview data
        run: |
          pnpm pack --pack-destination /tmp
          tarball=$(ls /tmp/dsh-suite-store-*.tgz)
          if tar -tzf "$tarball" | grep -q '^package/data/'; then
            echo "::error::the tarball contains data/, which no runtime code reads"
            tar -tzf "$tarball" | grep '^package/data/' | head -20
            exit 1
          fi
          echo "tarball ok: no data/ directory"

  # PACK — builds and tests, holds no publish credential.
  #
  # This job runs the repository's own code (`pnpm install`, `pnpm run check`,
  # `pnpm pack`). A merged PR can leave state that shapes the NEXT shell in the
  # same job: append `BASH_ENV=…` to $GITHUB_ENV (sourced before every later
  # script) or a fake `npm` to $GITHUB_PATH. A publish step in that job would
  # then run through the attacker's shell. Splitting the jobs is the defence;
  # cleaning up afterwards is not.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only: nothing here publishes or pushes. The publish job below owns
    # the GitHub Release write.
    permissions:
      contents: read
    # The tag is the release decision; the registry is the irreversible step.
    # `npm publish` cannot be undone, so it runs only from a tag, and only after
    # the same `check` this repository gates merges on.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No `version:` here: package.json's `packageManager` names
      # pnpm 11.22.0 exactly, and the action refuses to start when both are
      # given ("Multiple versions of pnpm specified"). Reading the exact pin is
      # also stricter than the `version: 11` major range it replaces.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--ignore-scripts`: a lifecycle hook in the lockfile, or one a merged PR
      # adds to the manifest, would run before any check with the checkout on
      # disk. This repository has no legitimate install hook.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The tag must agree with the manifest. Publishing `0.1.0` from a `v1.0.0`
      # tag is the mistake that cannot be taken back.
      - name: The tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "releasing $version"

      - run: pnpm run check

      # The tarball has to exist BEFORE anything names it: `npm publish` builds
      # one internally but leaves it in npm's own temp directory, so a later
      # glob matched nothing and the release silently attached no asset. Packing
      # here also produces the exact bytes that will be published.
      - name: Pack the tarball
        run: pnpm pack

      - uses: actions/upload-artifact@v4
        with:
          name: store-tarball
          path: dsh-suite-store-*.tgz
          if-no-files-found: error

  # PUBLISH — holds the credential, runs NO repository code.
  #
  # No checkout, no install, no build: the only inputs are the tarball and the
  # credential. Nothing a merged PR contains can execute here, so nothing can
  # set BASH_ENV / GITHUB_PATH / a fake `npm` for the step that owns it. The
  # release job above still runs the repository's own build — which is exactly
  # why it must not be the job that holds NPM_TOKEN.
  #
  # TWO AUTHENTICATION MODES, chosen by whether NPM_TOKEN exists:
  #
  #   token (first release)  npm cannot register a trusted publisher for a
  #                          package that does not exist — the settings page is
  #                          the package's own — so the FIRST publish needs a
  #                          Granular Access Token. (Automation tokens no longer
  #                          exist; npm removed every legacy token type in
  #                          November 2025.)
  #
  #   OIDC (everything after) With a trusted publisher configured on the
  #                          package, the job asks GitHub for a short-lived OIDC
  #                          token. Delete `secrets.NPM_TOKEN` and this path
  #                          takes over automatically.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `contents: write` is for the GitHub Release only; `id-token: write` is for
    # npm trusted publishing. Neither is inherited by sibling jobs.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-tarball

      # npm's OIDC support landed in CLI 11.5.1; the npm bundled with a Node 22
      # release can be older (v22 ships npm 10.x). Pinning npm is what makes the
      # OIDC path work instead of failing with an unhelpful 401.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@^11.5.1
      - run: npm --version

      # Publish the TARBALL, not the directory. A directory would re-read
      # whatever `package.json` is on disk; the tarball is the manifest `pnpm
      # pack` produced from the checked-out source.
      - name: Publish
        env:
          # Empty when the secret is not configured, which selects OIDC. `secrets`
          # cannot be interpolated into `if:`, so the branch lives in the shell.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp dsh-suite-store-*.tgz "$publish_dir"/
          printf 'registry=https://registry.npmjs.org/\n' > "$publish_dir/.npmrc"
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "publishing with NPM_TOKEN"
            printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$NPM_TOKEN" >> "$publish_dir/.npmrc"
          else
            echo "no NPM_TOKEN configured; using OIDC trusted publishing"
          fi
          cd "$publish_dir"
          # `npm_config_userconfig` pins the config so a stray HOME .npmrc on the
          # runner cannot redirect the request.
          npm_config_userconfig="$publish_dir/.npmrc" \
            env -u BASH_ENV \
            npm publish ./dsh-suite-store-*.tgz \
              --access public \
              --ignore-scripts \
              --registry https://registry.npmjs.org/
          cd - >/dev/null
          rm -rf "$publish_dir"

      # The tarball is attached to the GitHub release so a maintainer can diff
      # what was published without asking the registry.
      - name: Attach the tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-suite-store-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
